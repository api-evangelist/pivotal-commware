aid: pivotal-commware
name: Pivotal Commware
description: 'Pivotal Commware develops millimeter wave (mmWave) infrastructure for 5G networks, built
  around its Holographic Beam Forming technology and what it calls the world''s first smart repeater
  ecosystem. Its product line includes WaveScape network-planning software, the Pivot 5G outdoor network
  repeater, the Echo 5G subscriber repeater for indoor mmWave coverage, and IBMS, an Intelligent Beam
  Management System that pairs machine learning with smart repeaters for real-time network optimization.
  The company is venture-backed by Lux Capital. As of this enrichment pass Pivotal Commware publishes a
  corporate and marketing site (datasheets, white papers, videos, and a blog) but no public developer
  portal, API, or SDK surface was found.'
